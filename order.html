<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Order - Nana Web Studio</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    .container {
      max-width: 600px;
      margin: 30px auto;
    }

    .box {
      background: white;
      padding: 25px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.08);
    }

    h1 {
      text-align: center;
      margin-bottom: 10px;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 30px;
    }

    label {
      display: block;
      margin-top: 18px;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 15px;
      font-family: inherit;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 15px;
      border: 0;
      border-radius: 10px;
      background: #111827;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #111827;
      text-decoration: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="box">

      <h1>Form Pemesanan</h1>

      <p class="subtitle">
        Isi data berikut untuk memesan website.
      </p>

      <form id="orderForm">

        <label>Nama Anda</label>

        <input
          type="text"
          id="nama"
          placeholder="Contoh: Nana"
          required
        >


        <label>Nama Bisnis</label>

        <input
          type="text"
          id="bisnis"
          placeholder="Contoh: Nana Store"
          required
        >


        <label>Nomor WhatsApp</label>

        <input
          type="tel"
          id="nomor"
          placeholder="Contoh: 081234567890"
          required
        >


        <label>Pilih Paket</label>

        <select id="paket" required>

          <option value="">
            Pilih paket
          </option>

          <option value="Basic - Rp49.000">
            Basic - Rp49.000
          </option>

          <option value="Standard - Rp99.000">
            Standard - Rp99.000
          </option>

          <option value="Premium - Rp199.000">
            Premium - Rp199.000
          </option>

        </select>


        <label>Deskripsi Bisnis</label>

        <textarea
          id="deskripsi"
          placeholder="Ceritakan bisnis kamu..."
          required
        ></textarea>


        <label>Alamat / Lokasi</label>

        <textarea
          id="alamat"
          placeholder="Masukkan alamat bisnis"
        ></textarea>


        <label>Instagram / TikTok</label>

        <input
          type="text"
          id="sosmed"
          placeholder="@username atau link"
        >


        <label>Warna Website</label>

        <input
          type="text"
          id="warna"
          placeholder="Contoh: hitam, putih, biru"
        >


        <button type="submit">
          Lanjutkan Pesanan
        </button>

      </form>

      <a class="back" href="index.html">
        ← Kembali ke halaman utama
      </a>

    </div>

  </div>


  <script>

    document
      .getElementById("orderForm")
      .addEventListener("submit", function(event) {

        event.preventDefault();

        const nama =
          document.getElementById("nama").value;

        const bisnis =
          document.getElementById("bisnis").value;

        const nomor =
          document.getElementById("nomor").value;

        const paket =
          document.getElementById("paket").value;

        const deskripsi =
          document.getElementById("deskripsi").value;

        const alamat =
          document.getElementById("alamat").value;

        const sosmed =
          document.getElementById("sosmed").value;

        const warna =
          document.getElementById("warna").value;


        const pesan =
`Halo Nana Web Studio, saya ingin memesan website.

Nama: ${nama}

Nama Bisnis: ${bisnis}

WhatsApp: ${nomor}

Paket: ${paket}

Deskripsi:
${deskripsi}

Alamat:
${alamat}

Instagram/TikTok:
${sosmed}

Warna Website:
${warna}`;


        const url =
          "https://wa.me/?text="
          + encodeURIComponent(pesan);


        window.location.href = url;

      });

  </script>

</body>
</html>
